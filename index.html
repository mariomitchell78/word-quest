<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{--sky:#8fd6ff;--sky2:#e3f5ff;--grass:#4cc038;--dirt:#9a5b2f;--ink:#1b1b2f;--paper:#fff;--soft:#4d5873;
  --purple:#8b5cf6;--blue:#3b82f6;--pink:#ff6fb5;--yellow:#ffcf1f;
  --display:"Lilita One","Arial Black",system-ui,sans-serif;--ui:"Fredoka","Trebuchet MS",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--sky2)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--sky) 0,var(--sky2) 520px);color:var(--ink);font-family:var(--ui);padding:24px 16px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:46px;margin:0;line-height:1;text-align:center}
.sub{text-align:center;font-weight:600;color:var(--soft);font-size:18px;margin:0}
.kid{display:flex;align-items:center;gap:16px;text-decoration:none;color:#fff;border:4px solid var(--ink);border-radius:16px;padding:14px 18px;box-shadow:0 8px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .08s}
.kid:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}
.kid:focus-visible{outline:4px solid var(--yellow);outline-offset:4px}
.kid .ic{font-size:52px;line-height:1;text-shadow:none;background:rgba(255,255,255,.25);border:3px solid var(--ink);border-radius:12px;width:76px;height:76px;display:grid;place-items:center;flex:none}
.kid h2{font-family:var(--display);font-weight:400;font-size:32px;margin:0;line-height:1}
.kid p{margin:4px 0 0;font-weight:600;font-size:16px}
.kid .go{margin-left:auto;font-family:var(--display);font-size:30px}
.ground{height:30px;background:linear-gradient(180deg,var(--grass) 0 10px,var(--dirt) 10px);border:4px solid var(--ink);border-radius:10px}
.note{font-size:14px;color:var(--soft);text-align:center;margin:0}
</style>
</head>
<body>
<main class="wrap">
  <h1>Word Quest</h1>
  <p class="sub">Who's playing today?</p>
  <a class="kid" href="wq.html?kid=naeyleah" style="background:var(--purple)"><span class="ic">🦄</span><span><h2>Naeyleah</h2><p id="s-naeyleah">3rd grade · Word Quest</p></span><span class="go">▶</span></a>
  <a class="kid" href="wq.html?kid=zaedyn" style="background:var(--blue)"><span class="ic">🦖</span><span><h2>Zaedyn</h2><p id="s-zaedyn">3rd grade · Word Quest</p></span><span class="go">▶</span></a>
  <a class="kid" href="jr.html?kid=adelynn" style="background:var(--pink)"><span class="ic">🐣</span><span><h2>Adelynn</h2><p id="s-adelynn">1st grade · Word Quest Jr</p></span><span class="go">▶</span></a>
  <div class="ground"></div>
  <p class="note">Progress saves on this device.</p>
</main>
<script>
const load=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
const all=Object.assign({},load("wq2-players")||{},load("wqj-players")||{});
["naeyleah","zaedyn","adelynn"].forEach(id=>{const p=all[id],el=document.getElementById("s-"+id);if(p&&el)el.textContent+=` · 🪙 ${p.coins||0} · ⭐ ${p.xp||0} XP`});
</script>
</body>
</html>
