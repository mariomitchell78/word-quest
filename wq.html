<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word Quest 2.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: blocky game world. HUD row, hero panel (avatar + pet on a grass block), world tabs, then an obby map whose platforms are the levels. Play screens are one big card. Deliberately one bright daytime look. */
:root{
  --sky:#8fd6ff; --sky2:#e3f5ff; --grass:#4cc038; --grassd:#2f8a22; --dirt:#9a5b2f;
  --ink:#1b1b2f; --paper:#ffffff; --soft:#4d5873; --lock:#d5deea; --line:#b9cbe0;
  --red:#ff4b4b; --blue:#3b82f6; --yellow:#ffcf1f; --green:#22c55e; --purple:#8b5cf6; --orange:#ff9f1c; --pink:#ff6fb5;
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --ui:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Verdana",system-ui,sans-serif;
  color-scheme:light;
}
html{background:var(--sky2)}
body{background:linear-gradient(180deg,var(--sky) 0,var(--sky2) 560px);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;padding-inline:16px;padding-block:14px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--purple);outline-offset:3px}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:8px 12px;min-width:0;width:100%}

/* chunky block buttons */
.btn,.next,.ghost{font-family:var(--display);font-size:21px;color:#fff;background:var(--green);border:4px solid var(--ink);border-radius:12px;padding:10px 14px;box-shadow:0 6px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active,.next:active,.ghost:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn:disabled,.next:disabled{opacity:.5;cursor:not-allowed}
.next{background:var(--blue)}
.next.go,.btn.green{background:var(--green)}
.btn.blue{background:var(--blue)} .btn.yellow{background:var(--yellow);color:var(--ink);text-shadow:none} .btn.red{background:var(--red)} .btn.purple{background:var(--purple)}
.ghost{background:var(--paper);color:var(--ink);text-shadow:none;font-size:19px}
.big{font-size:24px;padding:14px}
.glow{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 6px 0 var(--ink),0 0 0 6px rgba(255,207,31,.55)}}

.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hbtn{font-family:var(--ui);font-weight:700;font-size:17px;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:4px 10px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 var(--ink);font-variant-numeric:tabular-nums;min-height:44px}
.hbtn.who{padding:2px 10px 2px 4px;max-width:100%}
.hbtn.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn[aria-pressed="true"]{background:var(--purple);color:#fff}
.hud .spacer{flex:1}

.hero{background:var(--paper);border:4px solid var(--ink);border-radius:16px;box-shadow:0 8px 0 var(--ink);display:grid;grid-template-columns:auto 1fr;overflow:hidden}
@media (max-width:440px){.hero{grid-template-columns:1fr}}
.stage{position:relative;background:linear-gradient(180deg,#bfe8ff,#e9f8ff);min-width:170px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-top:16px}
.stand{display:flex;align-items:flex-end;gap:2px;position:relative;z-index:1;margin-bottom:-6px}
.stand .pet{font-size:40px;line-height:1;margin-bottom:8px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.ground{height:34px;align-self:stretch;background:linear-gradient(180deg,var(--grass) 0 12px,var(--dirt) 12px);border-top:4px solid var(--ink)}
.herotext{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.eyebrow{font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--purple)}
.herotext h1{font-size:38px;color:var(--ink)}
.petline{font-family:var(--ui);font-weight:600;font-size:16px;color:var(--soft)}
.xp{height:16px;border:3px solid var(--ink);border-radius:6px;background:var(--sky2);overflow:hidden}
.xp div{height:100%;background:var(--yellow)}
.herobtns{display:flex;gap:10px;flex-wrap:wrap}
.herobtns .btn{font-size:18px;padding:8px 12px;flex:1;min-width:140px}

.challenge{background:#ffe9d6;border:4px solid var(--ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.challenge h3{font-size:20px}
.challenge .w{font-family:var(--display);color:var(--red);font-size:24px}
.challenge.done{background:var(--paper);border-style:dashed}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.tab{font-family:var(--display);font-size:13px;min-width:0;background:var(--paper);border:4px solid var(--ink);border-radius:12px;padding:8px 4px;box-shadow:0 5px 0 var(--ink);line-height:1.1}
.tab[aria-selected="true"]{background:var(--yellow)}
.tab span{display:block;font-size:24px}

.mapwrap{position:relative;background:linear-gradient(180deg,#a8e0ff,#e6f7ff 70%,#d8f3cf);border:4px solid var(--ink);border-radius:16px;overflow:hidden}
.mapwrap .cloud{position:absolute;background:#fff;border:3px solid #cfe8f7;border-radius:6px;opacity:.9}
.plat{position:absolute;width:42%;height:78px;border:4px solid var(--ink);border-radius:10px;box-shadow:0 10px 0 var(--ink);color:#fff;text-align:left;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-content:center;padding:6px 10px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.plat::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:rgba(255,255,255,.35);border-radius:6px 6px 0 0}
.plat .num{grid-row:span 2;font-family:var(--display);font-size:30px;line-height:1;align-self:center}
.plat .pname{font-family:var(--display);font-size:17px;line-height:1.05;overflow-wrap:anywhere}
.plat .pstars{font-family:var(--ui);font-weight:700;font-size:14px}
.plat.locked{background:var(--lock)!important;color:var(--soft);text-shadow:none;border-style:dashed;box-shadow:0 10px 0 #9fb0c6}
.plat.now{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 10px 0 var(--ink),0 0 0 6px rgba(255,255,255,.9)}}
.finish{position:absolute;width:42%;height:66px;border:4px solid var(--ink);border-radius:10px;box-shadow:0 10px 0 var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:22px;background:repeating-conic-gradient(#fff 0 25%,#1b1b2f 0 50%) 0 0/24px 24px;color:var(--ink)}
.finish span{background:var(--yellow);border:3px solid var(--ink);border-radius:8px;padding:2px 10px}
.cube{position:absolute;width:20px;height:20px;background:var(--orange);border:3px solid var(--ink);border-radius:4px;box-shadow:0 4px 0 var(--ink)}
.mapav{position:absolute;width:56px;height:94px;z-index:3;transition:top .9s cubic-bezier(.3,1.4,.5,1),left .9s ease-in-out;pointer-events:none;display:flex;align-items:flex-end}
.mapav .petmini{position:absolute;right:-22px;bottom:0;font-size:24px}
.mapav.jumping .avin{animation:hop .9s ease-in-out}
@keyframes hop{40%{transform:translateY(-46px)}100%{transform:translateY(0)}}
.maptitle{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.maptitle h2{font-size:24px}
.maptitle p{font-family:var(--ui);font-weight:600;font-size:15px;color:var(--soft)}

.arcade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:4px solid var(--ink);border-radius:14px;padding:12px;box-shadow:0 6px 0 var(--ink);color:#fff;min-width:0;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.game .ic{font-size:34px;line-height:1;text-shadow:none}
.game h3{font-size:20px}
.game p{font-family:var(--ui);font-weight:600;font-size:14px}
.game .play{margin-top:4px;font-family:var(--display);font-size:15px;background:rgba(0,0,0,.25);border-radius:8px;padding:2px 10px}
.game.locked{background:var(--lock)!important;color:var(--soft);text-shadow:none;border-style:dashed;box-shadow:none}

.box{background:var(--paper);border:4px solid var(--ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.box.coral{border-color:var(--red)}
.box h3{font-size:20px}
.box.coral h3{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--ui);font-weight:600;font-size:16px;border:3px solid var(--ink);border-radius:8px;padding:2px 10px;background:var(--sky2)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;border:3px solid var(--ink);border-radius:10px;padding:6px 4px;background:var(--yellow);font-family:var(--ui);font-weight:700;font-size:13px;line-height:1.1}
.bdg b{font-size:28px;font-weight:400;line-height:1.1}
.bdg.off{background:var(--paper);opacity:.38;filter:grayscale(1)}
.note{font-family:var(--ui);font-size:15px;color:var(--soft)}
.err{font-family:var(--ui);font-size:15px;color:var(--red);font-weight:700}
.link{font-family:var(--ui);font-weight:600;font-size:15px;color:var(--soft);text-decoration:underline;align-self:flex-start;min-height:32px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sync{font-family:var(--ui);font-size:14px;color:var(--soft)}

/* play screens */
.bar{display:flex;align-items:center;gap:10px}
.back{font-family:var(--display);font-size:17px;background:var(--paper);border:4px solid var(--ink);border-radius:10px;padding:6px 12px;box-shadow:0 4px 0 var(--ink)}
.track{flex:1;height:20px;border:4px solid var(--ink);border-radius:8px;background:var(--paper);overflow:hidden}
.fill{height:100%;background:var(--green);transition:width .3s}
.count{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 0 var(--ink)}
.ask{font-family:var(--display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--purple)}
.prompt{font-size:24px;line-height:1.35}
.prompt .w{font-family:var(--display);font-size:38px;color:var(--purple);letter-spacing:.02em}
.blank{display:inline-block;min-width:110px;border-bottom:5px solid var(--purple);color:var(--purple);font-weight:700}
.say{align-self:flex-start;font-family:var(--ui);font-weight:700;font-size:15px;color:var(--purple);border:3px solid var(--purple);border-radius:10px;padding:4px 12px;min-height:40px}
.bigsay{font-family:var(--display);font-size:24px;color:#fff;background:var(--purple);border:4px solid var(--ink);border-radius:14px;padding:14px;box-shadow:0 6px 0 var(--ink)}
.again{font-family:var(--display);font-size:15px;color:var(--red);letter-spacing:.06em;text-transform:uppercase}
.turnbar{font-family:var(--display);font-size:24px;text-align:center;border:4px solid var(--ink);border-radius:12px;padding:8px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices.long{grid-template-columns:1fr}
@media (max-width:420px){.choices{grid-template-columns:1fr}}
.choice{font-family:var(--display);font-size:23px;background:var(--paper);border:4px solid var(--ink);border-radius:12px;padding:12px 10px;box-shadow:0 6px 0 var(--ink);min-width:0;overflow-wrap:anywhere}
.choices.long .choice{font-family:var(--body);font-weight:700;font-size:19px;text-align:left;padding:12px 16px}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.choice.right{background:var(--green);color:#fff}
.choice.wrong{background:var(--red);color:#fff;animation:shake .35s}
.choice:disabled{cursor:default}
.choice.dim{opacity:.4}
.slots,.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.slot,.tile{width:42px;height:50px;border-radius:8px;font-family:var(--display);font-size:28px;display:grid;place-items:center}
.slot{border:3px dashed var(--line);background:var(--sky2)}
.slot.on{border:4px solid var(--ink);background:var(--paper)}
.slot.keep{background:var(--green);color:#fff}
.tile{border:4px solid var(--ink);background:var(--yellow);box-shadow:0 5px 0 var(--ink)}
.tile.used{visibility:hidden}
.slots.ok .slot.on{background:var(--green);color:#fff}
.slots.bad{animation:shake .35s}
.slots.bad .slot.on.miss{background:var(--red);color:#fff}
.typed{min-height:64px;border:4px solid var(--ink);border-radius:12px;background:var(--sky2);font-family:var(--display);font-size:38px;letter-spacing:.08em;display:flex;align-items:center;justify-content:center;padding:4px 10px;overflow-wrap:anywhere}
.typed.ok{background:var(--green);color:#fff} .typed.bad{background:var(--red);color:#fff;animation:shake .35s}
.caret{display:inline-block;width:4px;height:38px;background:var(--purple);margin-left:4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.kb{display:flex;flex-direction:column;gap:6px}
.kbrow{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:46px;height:50px;font-family:var(--display);font-size:22px;background:var(--paper);border:3px solid var(--ink);border-radius:8px;box-shadow:0 4px 0 var(--ink)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.key.wide{max-width:76px;flex:1.6;font-size:18px;background:var(--lock)}
.feedback{min-height:28px;font-family:var(--display);font-size:22px;text-align:center}
.feedback.good{color:var(--green)} .feedback.oops{color:var(--red)}
.teach{background:var(--sky2);border:3px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:19px}
.flash{min-height:240px;justify-content:center;text-align:center}
.flash.tap{cursor:pointer}
.flash .pic{font-size:56px;line-height:1}
.flash .word{font-family:var(--display);font-size:46px;color:var(--purple);overflow-wrap:anywhere}
.flash .mean{font-size:24px}
.flash .ex{font-size:19px;color:var(--soft)}
.flash .turn{font-family:var(--display);font-size:26px;color:var(--red)}
.row{display:flex;gap:12px}
.row>*{flex:1}
.steps{display:flex;justify-content:center;gap:8px}
.dot{width:14px;height:14px;border-radius:3px;border:3px solid var(--ink);background:var(--paper)}
.dot.on{background:var(--purple)}
.story{font-size:21px;line-height:1.75}
.story button.sw{font-family:var(--ui);font-weight:700;color:var(--purple);background:var(--sky2);border-radius:6px;padding:0 6px;border-bottom:4px solid var(--purple)}
.story button.sw.lit{background:var(--yellow);color:var(--ink)}
.timer{font-family:var(--display);font-size:44px;text-align:center;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
.result{text-align:center;align-items:center}
.bigicon{font-size:58px;line-height:1.1;letter-spacing:6px}
.result h2{font-size:32px}
.unlock{font-family:var(--display);font-size:21px;color:var(--green)}
.coinline{font-family:var(--display);font-size:22px;color:#b7791f}
.star{color:var(--yellow);-webkit-text-stroke:2px var(--ink)}

/* avatar shop */
.shopstage{display:flex;justify-content:center;align-items:flex-end;gap:4px;background:linear-gradient(180deg,#bfe8ff,#e9f8ff);border:4px solid var(--ink);border-radius:16px;padding-top:14px;overflow:hidden;position:relative}
.shopstage .pet{font-size:46px;margin-bottom:34px}
.shopstage .ground{position:absolute;left:0;right:0;bottom:0}
.shopstage svg{position:relative;z-index:1;margin-bottom:24px}
.stabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.stab{flex:none;font-family:var(--display);font-size:16px;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:6px 12px;box-shadow:0 4px 0 var(--ink)}
.stab[aria-selected="true"]{background:var(--yellow)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);border:4px solid var(--ink);border-radius:12px;padding:6px 4px;box-shadow:0 5px 0 var(--ink);min-width:0}
.item.on{background:#dcfce7;border-color:var(--grassd)}
.item.try{background:#fff7d6}
.item .nm{font-family:var(--ui);font-weight:700;font-size:14px;line-height:1.1}
.item .pr{font-family:var(--display);font-size:15px}
.item .pr.own{color:var(--grassd)}
.swatch{width:54px;height:54px;border-radius:10px;border:4px solid var(--ink);margin:8px 0}
.buybar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border:4px solid var(--ink);border-radius:14px;padding:12px;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;gap:10px;z-index:4}
.buybar p{font-family:var(--ui);font-weight:700;font-size:18px;text-align:center}

.key.go{background:var(--green);color:#fff}
.strip{font-family:var(--display);font-size:20px;background:var(--sky2);border:3px solid var(--ink);border-radius:12px;padding:8px 10px;line-height:1.5;overflow-wrap:anywhere}
.notes p{display:flex;gap:10px;align-items:flex-start}
.notes .chip{flex:none}
/* skills */
.pic{font-size:50px;text-align:center;line-height:1.25;background:var(--sky2);border:3px solid var(--ink);border-radius:12px;padding:8px;margin-bottom:10px}
.psg{background:#fff7e0;border:3px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:20px;line-height:1.55;margin-bottom:6px}
.learn{background:#fff7e0;border:4px solid var(--ink);border-radius:14px;padding:14px;font-size:21px;line-height:1.5}
.skicon{font-size:58px;line-height:1;text-align:center}
.phr{border-radius:6px;transition:background .2s}
.phr.hl{background:#fff3b0;box-shadow:0 0 0 4px #fff3b0}
.slash{color:var(--purple);font-family:var(--display);padding:0 3px;opacity:.75}
.fw{font:inherit;color:inherit;background:none;border:0;padding:0 2px;border-radius:5px;line-height:inherit}
.fw.err{background:var(--red);color:#fff;text-decoration:line-through}
.timerbig{font-family:var(--display);font-size:40px;text-align:center;font-variant-numeric:tabular-nums}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat div{border:3px solid var(--ink);border-radius:12px;padding:8px 4px;background:var(--sky2);text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:30px}
.stat span{font-family:var(--ui);font-size:13px;color:var(--soft)}
.wpart{display:flex;flex-direction:column;gap:6px}
.wpart label{font-family:var(--display);font-size:16px;color:var(--purple)}
.wpart textarea{font-family:var(--body);font-size:19px;min-height:84px}
.checks{display:grid;gap:6px;font-family:var(--ui);font-weight:600;font-size:16px}
.checks .ok{color:var(--grassd)} .checks .no{color:var(--soft)}
.published{background:#fffdf3;border:4px solid var(--ink);border-radius:16px;padding:18px;box-shadow:0 8px 0 var(--ink);font-size:20px;line-height:1.6;display:flex;flex-direction:column;gap:8px}
.published h2{font-size:28px}
.skf{display:grid;grid-template-columns:1fr;gap:6px}
/* read together */
.passage{font-size:22px;line-height:1.95}
.passage.poem .sent{display:block}
.sent{border-radius:8px;transition:background .2s,opacity .2s}
.passage.live .sent{opacity:.35}
.passage.live .sent.done{opacity:.6}
.passage.live .sent.cur{opacity:1;background:#fff3b0;box-shadow:0 0 0 5px #fff3b0}
.rw{font:inherit;color:inherit;background:none;border:0;padding:0 2px;border-radius:6px;cursor:pointer;line-height:inherit}
.rw.hl{background:var(--purple);color:#fff}
.rw.marked{text-decoration:underline wavy var(--red) 2px;text-underline-offset:6px}
.modes{display:grid;gap:10px}
.mode{display:flex;gap:12px;align-items:center;text-align:left;background:var(--paper);border:4px solid var(--ink);border-radius:12px;padding:10px 14px;box-shadow:0 5px 0 var(--ink)}
.mode[aria-pressed="true"]{background:var(--yellow)}
.mode b{font-size:30px;font-weight:400;line-height:1}
.mode h3{font-size:19px}
.mode p{font-family:var(--ui);font-size:14px;color:var(--soft)}
.speed{display:flex;gap:8px;flex-wrap:wrap}
.readbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:10px}
.readbar>*{flex:1}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.logt{width:100%;border-collapse:collapse;font-family:var(--ui);font-size:14px}
.logt th,.logt td{border-top:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
.logwrap{overflow-x:auto}
.players{display:grid;gap:12px}
.pcard{display:flex;align-items:center;gap:12px;background:var(--paper);border:4px solid var(--ink);border-radius:14px;padding:8px 14px;box-shadow:0 6px 0 var(--ink);text-align:left}
.pcard h2{font-size:24px}
.pcard p{font-family:var(--ui);color:var(--soft);font-size:15px}
.ptable{width:100%;border-collapse:collapse;font-family:var(--ui);font-size:15px}
.ptable td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.ptable td:last-child{text-align:right;font-weight:700}
.wrow{display:grid;grid-template-columns:1fr 1.6fr auto;gap:8px;align-items:start}
.wrow textarea{grid-column:1/3;min-height:44px}
.x{font-family:var(--display);font-size:18px;border:3px solid var(--ink);border-radius:8px;width:44px;height:44px;background:var(--paper)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--ui);font-weight:700;font-size:18px;border-radius:12px;padding:10px 18px;z-index:9;max-width:calc(100% - 32px);text-align:center}
.banner{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:10;background:var(--yellow);border:4px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink);padding:10px 18px;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);animation:drop .5s cubic-bezier(.3,1.5,.5,1)}
.banner b{font-size:38px;line-height:1;font-weight:400}
.banner small{display:block;font-family:var(--display);font-size:14px;letter-spacing:.08em;color:var(--purple)}
.banner span{font-family:var(--display);font-size:22px}
@keyframes drop{from{transform:translate(-50%,-140%)}to{transform:translate(-50%,0)}}
.coinpop{position:fixed;right:20px;top:calc(60px + env(safe-area-inset-top,0px));z-index:10;font-family:var(--display);font-size:26px;color:#b7791f;-webkit-text-stroke:1px var(--ink);animation:rise 1.2s ease-out forwards;pointer-events:none}
@keyframes rise{from{transform:translateY(10px);opacity:1}to{transform:translateY(-50px);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes popc{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.pop{animation:popc .35s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const clone=x=>JSON.parse(JSON.stringify(x));
function normContent(c){
  if(!c||!Array.isArray(c.words)||c.words.length<4)return clone(DEFAULT_CONTENT);
  if(c.id==="u23"){if(!c.spelling||!Array.isArray(c.spelling.list))return clone(DEFAULT_CONTENT);if(c.unit==="Unit 2.3")c.unit=DEFAULT_CONTENT.unit;if(!Array.isArray(c.readings))c.readings=clone(DEFAULT_CONTENT.readings);if(!c.skills)c.skills=clone(DEFAULT_CONTENT.skills)}
  if(!c.skills||!Array.isArray(c.skills.levels))c.skills={id:"none",list:{},levels:[],fluency:[],writing:null};
  if(!Array.isArray(c.readings))c.readings=c.story&&c.story.text?[{title:c.story.title||"Story",text:c.story.text.replace(/[{}]/g,"")}]:[];
  if(!c.spelling||!Array.isArray(c.spelling.list))c.spelling={id:"none",pattern:"",list:[]};
  return c;
}

const timers={},pending=new Set();
function backupPlayers(){try{const B=load("wq2-players-backup",{});Object.keys(players).forEach(id=>{const p=players[id];if(p&&p.name&&(!B[id]||(p.updated||0)>=(B[id].updated||0)))B[id]=p});save("wq2-players-backup",B)}catch(e){}}
(()=>{const B=load("wq2-players-backup",null),gone=load("wq2-deleted",[]);if(B)Object.keys(B).forEach(id=>{if(!players[id]&&!gone.includes(id))players[id]=B[id]});backupPlayers()})();
function savePlayer(id=cur){
  if(players[id])players[id].updated=Date.now();
  save("wq2-players",players);backupPlayers();
  if(!DB||!players[id])return;
  clearTimeout(timers[id]);pending.add(id);
  timers[id]=setTimeout(()=>{const body=clone(players[id]||{});if(!body.name){pending.delete(id);return}
    DB.doc("players/"+id).set(body).then(()=>setSync("synced")).catch(e=>setSync(e&&e.code==="not_granted"?"readonly":"error")).finally(()=>pending.delete(id))},500);
}
function saveContent(){if(!content.created)content.created=Date.now();weeks[content.id]=content;save("wq2-weeks",weeks);if(DB)return DB.doc("weeks/"+content.id).set(clone(content)).then(()=>setSync("synced")).catch(e=>{setSync(e&&e.code==="not_granted"?"readonly":"error");throw e});return Promise.resolve()}
let ro=false;

const syncText=()=>({synced:"☁️ Progress saves to your Claude account",local:"📱 Progress saves on this device",readonly:"⚠️ Saving on this device only. Ask the owner for edit access.",error:"⚠️ Couldn't sync. Saving on this device."})[syncState];
async function initDB(){
  try{if(!window.claude||!claude.use)return;DB=await claude.use("db")}catch(e){DB=null}
  if(!DB)return;
  setSync("synced");
  let firstPlayers=true;
  let firstWeeks=true;
  DB.collection("weeks").onSnapshot(q=>{
    let ch=false;q.docs.forEach(d=>{const v=d.data();if(v&&Array.isArray(v.words)){weeks[d.id]=normContent(Object.assign(v,{id:d.id}));ch=true}});
    if(firstWeeks){firstWeeks=false;Object.values(weeks).forEach(w=>{if(!BUILTIN_IDS.includes(w.id)&&!q.docs.some(d=>d.id===w.id))DB.doc("weeks/"+w.id).set(clone(w)).catch(()=>{})})}
    if(ch){save("wq2-weeks",weeks);content=weeks[viewId]||weeks[latestId()];if(screen==="home"||screen==="pick")render()}
  },()=>setSync("error"));
  DB.doc("config/words").get().then(s=>{if(s.exists){const v=s.data();if(v&&v.id&&Array.isArray(v.words)&&!weeks[v.id]){addWeek(Object.assign(v,{created:v.created||3}));save("wq2-weeks",weeks)}}}).catch(()=>{});
  DB.doc("config/family").get().then(s=>{if(s.exists&&s.data()&&s.data().text)save("wq-family",s.data().text)}).catch(()=>{});
  DB.collection("players").onSnapshot(q=>{
    const remote={};q.docs.forEach(d=>{const v=d.data();if(v&&v.name)remote[d.id]=v});
    // never drop a player that only lives on this device; keep whichever copy is newer
    const gone=load("wq2-deleted",[]),merged={};
    Object.keys(remote).forEach(id=>{if(!gone.includes(id))merged[id]=remote[id]});
    Object.keys(players).forEach(id=>{const l=players[id],r=merged[id];
      if(!r){merged[id]=l;if(!ro)savePlayer(id)}else if(pending.has(id)||(l.updated||0)>(r.updated||0)){merged[id]=l;if(!pending.has(id)&&!ro)savePlayer(id)}});
    players=merged;save("wq2-players",players);backupPlayers();
    if(cur&&!players[cur])cur=null;
    if(screen==="home"||screen==="pick")render();
  },()=>setSync("error"));
}

/* ===================== Sound and voice ===================== */
let ac;
function tones(list,type="triangle",vol=.12){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();list.forEach(([f,t,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime+t);g.gain.setValueAtTime(vol,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+d);o.connect(g).connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d+.02)})}catch(e){}}
function beep(ok){ok?tones([[523,0,.18],[659,.09,.18],[784,.18,.2]]):tones([[220,0,.18],[180,.1,.2]],"square",.08)}
const sfx={coin:()=>tones([[988,0,.08],[1319,.07,.22]],"square",.06),jump:()=>tones([[330,0,.12],[494,.08,.12],[660,.16,.16]],"square",.06),
  badge:()=>tones([[523,0,.12],[659,.1,.12],[784,.2,.12],[1047,.3,.35]]),chest:()=>tones([[392,0,.1],[523,.1,.1],[659,.2,.1],[784,.3,.1],[1047,.4,.4]])};
let voiceOn=load("wq-voice","on")!=="off",voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  const pref=["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Karen","Moira","Ava","Allison"];
  voice=pref.map(p=>vs.find(v=>v.name.includes(p))).find(Boolean)||vs.find(v=>v.lang==="en-US")||vs[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
let speakToken=0;
function speak(t,cb,delay){
  const tok=++speakToken;let fired=false;
  const fire=()=>{if(!fired&&tok===speakToken){fired=true;cb&&cb()}};
  try{speechSynthesis.cancel()}catch(e){}
  if(!voiceOn){if(cb)setTimeout(fire,1200);return}
  try{const u=new SpeechSynthesisUtterance(t);u.rate=.82;u.pitch=1.05;if(voice)u.voice=voice;u.onend=()=>setTimeout(fire,350);
    setTimeout(()=>{try{speechSynthesis.speak(u)}catch(e){}},delay||0)}catch(e){}
  if(cb)setTimeout(fire,(delay||0)+t.length*85+2000);
}
const say=(t,delay)=>{if(voiceOn)speak(t,null,delay)};
const hear=t=>{const v=voiceOn;voiceOn=true;speak(t);voiceOn=v};
const hush=()=>{speakToken++;try{speechSynthesis.cancel()}catch(e){}};

/* ===================== Helpers ===================== */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const find=w=>WORDS().find(x=>x.w===w);
const findS=w=>SPL().find(x=>x.w===w);
const others=(item,n)=>shuffle(WORDS().filter(x=>x!==item)).slice(0,n);
const spellOut=w=>[...w].join(", ");
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function blankOut(ex,w){if(!ex)return"";const re=new RegExp("\\b"+reEsc(w)+"\\b","i");return re.test(ex)?ex.replace(re,"___"):""}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
let bannerQ=[],bannerOn=false;
function banner(icon,title){bannerQ.push([icon,title]);if(!bannerOn)nextBanner()}
function nextBanner(){const b=bannerQ.shift();if(!b){bannerOn=false;return}bannerOn=true;sfx.badge();
  const d=document.createElement("div");d.className="banner";d.setAttribute("role","status");d.innerHTML=`<b>${b[0]}</b><div><small>BADGE UNLOCKED!</small><span>${esc(b[1])}</span></div>`;
  document.body.appendChild(d);say(`Badge unlocked! ${b[1]}!`,300);setTimeout(()=>{d.remove();nextBanner()},2800)}
function coinPop(n){const d=document.createElement("div");d.className="coinpop";d.textContent=`+${n} 🪙`;document.body.appendChild(d);setTimeout(()=>d.remove(),1300);
  const c=document.getElementById("cn");if(c)c.textContent=P().coins}
function addCoins(n){if(!n)return;const p=P();p.coins=(p.coins||0)+n;sfx.coin();coinPop(n);if(p.coins>=100)give("rich");savePlayer()}
function addMiss(w,src){const r=src==="s"?S():U();r.miss[w]=(r.miss[w]||0)+1;savePlayer()}
function addXP(n){const p=P(),before=petStage(p.xp);p.xp=(p.xp||0)+n;const after=petStage(p.xp);savePlayer();
  if(after[0]!==before[0])setTimeout(()=>{toast(`Your pet grew into a ${after[1]}! ${after[0]}`);say(`Wow! Your pet grew into a ${after[1]}!`)},3200)}
function give(id){const p=P();if(p.stickers.includes(id)||!BADGES[id])return;p.stickers.push(id);savePlayer();setTimeout(()=>banner(...BADGES[id]),500)}
function petStage(xp){let s=PETS[0];for(const p of PETS)if((xp||0)>=p[2])s=p;return s}
const recFor=id=>id.startsWith("sp")?S():/^k/.test(id)?K():/^[xy]/.test(id)?M():U();
function M(){const p=P();p.math=p.math||{};const m=p.math;m.best=m.best||{};m.time=m.time||{};m.timed=m.timed||{};return m}
function mathLevels(){return[...FACTS.map((n,i)=>({id:"x"+n,n,name:n+"s",desc:`Times tables: the ${n}s`,color:SKCOL[i%6]})),{id:"xmix",n:0,name:"Mixed Review",desc:"All the facts you've learned",color:"var(--ink)"}]}
const starsFor=id=>recFor(id).best[id]||0;
const starsCalc=(score,n)=>score>=n?3:score>=Math.ceil(n*.75)?2:score>=Math.ceil(n/2)?1:0;
const streakNow=()=>{const s=P().streak;return s.last===today()||s.last===yesterday()?s.n:0};
function patternOf(w){
  for(const b of ["scr","spr","spl","str","squ","shr","thr","sch","chr","spl"])if(w.startsWith(b))return{type:"blend",v:b};
  if(w.startsWith("wr"))return{type:"silent",v:"w"};if(w.startsWith("kn"))return{type:"silent",v:"k"};if(w.startsWith("gn")||w.endsWith("gn"))return{type:"silent",v:"g"};
  if(w.endsWith("mb"))return{type:"silent",v:"b"};
  for(const d of ["tch","wh","sh","th","ch","ph"])if(w.includes(d))return{type:"digraph",v:d};return null}
function spLevels(){const n=SPL().filter(x=>patternOf(x.w)).length;return SLEVELS_ALL.filter(l=>l.id!=="sp2"||n>=4)}
function passed(id){return id==="cards"?!!U().cards:starsFor(id)>=PASS}
function isOpen(id){
  const u=U(),s=S();
  if(id.startsWith("sp")){if(!SPL().length)return false;if(id==="sp3"||s.unlock)return true;const L=spLevels(),i=L.findIndex(l=>l.id===id);return i===0||(i>0&&passed(L[i-1].id))}
  if(/^k/.test(id)){const L=skLevels();if(!L.length)return false;if(K().unlock)return true;const i=L.findIndex(l=>l.id===id);return i===0||(i>0&&passed(L[i-1].id))}
  if(/^y/.test(id))return true;
  if(/^x/.test(id)){if(M().unlock)return true;const L=mathLevels(),i=L.findIndex(l=>l.id===id);return i===0||(i>0&&passed(L[i-1].id))}
  if(u.unlock)return true;
  const need={cards:true,meaning:!!u.cards,sentence:passed("meaning"),spell:passed("sentence"),final:passed("spell"),
    story:!!u.cards&&!!(content.story&&content.story.text),same:!!u.cards,teach:!!u.cards,speed:passed("meaning"),versus:!!u.cards,daily:!!u.cards,read:true};
  return !!need[id]}
function lockMsg(id){
  if(/^k/.test(id)){const L=skLevels(),i=L.findIndex(l=>l.id===id);return i>0?`Get 2 stars in ${L[i-1].name} to open this.`:"No skills practice yet."}
  if(/^x/.test(id)){const L=mathLevels(),i=L.findIndex(l=>l.id===id);return i>0?`Get 2 stars in the ${L[i-1].name} to open this.`:""}
  if(id.startsWith("sp")){const L=spLevels(),i=L.findIndex(l=>l.id===id);return i>0?`Get 2 stars in ${L[i-1].name} to open this.`:"No spelling words yet."}
  return({meaning:"Finish Word Cards to open this.",sentence:"Get 2 stars in Meaning Match to open this.",spell:"Get 2 stars in Fill the Blank to open this.",
  final:"Get 2 stars in Letter Builder to open this.",speed:"Get 2 stars in Meaning Match to open this.",daily:"Finish Word Cards first."})[id]||(id==="story"&&content.story&&!content.story.text?"No story for this word list yet.":"Finish Word Cards to open this.")}
function bar(i,n){return `<div class="bar"><button class="back" id="back">← Map</button><div class="track"><div class="fill" style="width:${Math.min(100,i/n*100)}%"></div></div><span class="count">${Math.min(i,n)}/${n}</span></div>`}
function wireBack(tab){const b=app.querySelector("#back");if(b)b.onclick=()=>{hush();document.onkeydown=null;home(tab)}}
function updateStreak(){const p=P(),t=today();if(p.streak.last===t)return;p.streak.n=p.streak.last===yesterday()?p.streak.n+1:1;p.streak.last=t;
  if(p.streak.n>=3)give("streak3");if(p.streak.n>=7)give("streak7");savePlayer()}
function todaysWord(){const p=P(),t=today();
  if(p.challenge.date!==t||!find(p.challenge.word)){
    const tricky=Object.entries(U().miss).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).filter(find);
    const seed=[...t].reduce((a,c)=>a+c.charCodeAt(0),0);
    p.challenge={date:t,word:tricky.length?tricky[seed%Math.min(3,tricky.length)]:WORDS()[seed%WORDS().length].w,done:false};savePlayer()}
  return p.challenge}

/* ===================== Player select ===================== */
function render(){if(!cur||!players[cur])return pickPlayer();home()}
function pickPlayer(){
  screen="pick";hush();document.onkeydown=null;
  const ids=Object.keys(players).sort((a,b)=>(players[a].created||0)-(players[b].created||0));
  app.innerHTML=`<div><p class="eyebrow">${esc(content.unit)}</p><h1 style="font-size:40px">Who's playing?</h1></div>
   <div class="players">${ids.map(id=>{const p=ensure(players[id]),pt=petStage(p.xp);return `<button class="pcard" data-id="${id}">${avatarSVG(p.avatar,70)}<span><h2>${esc(p.name)} ${pt[0]}</h2><p>🪙 ${p.coins} · ${p.xp} XP${p.streak.n?` · 🔥 ${p.streak.n}`:""}</p></span></button>`}).join("")}</div>
   <div class="box"><h3>New player</h3><div class="row"><input id="pname" maxlength="20" placeholder="Type a name" autocomplete="off"><button class="btn" id="add" style="flex:0 0 auto">Add</button></div></div>
   <p class="sync" id="sync">${syncText()}</p>`;
  app.querySelectorAll(".pcard").forEach(b=>b.onclick=()=>{cur=b.dataset.id;save("wq2-cur",cur);home();say(`Hi ${players[cur].name}! Let's play.`)});
  const add=()=>{const n=app.querySelector("#pname").value.trim();if(!n)return;const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    players[id]=newPlayer(n);cur=id;save("wq2-cur",cur);savePlayer(id);shop(true);say(`Welcome, ${n}! First, make your avatar.`)};

  app.querySelector("#pname").onkeydown=e=>{if(e.key==="Enter")add()};
}

   <div class="herotext"><button class="hbtn" id="weekbtn" style="align-self:flex-start">📅 ${esc(content.unit)} ▾</button><h1>Word Quest</h1>

function cards(i){
  const W=WORDS(),it=W[i];let stage="front";const order=["front","back","turn","check"];
  const steps=()=>`<div class="steps">${order.map(s=>`<span class="dot ${order.indexOf(s)<=order.indexOf(stage)?"on":""}"></span>`).join("")}</div>`;
  const ex=s=>esc(s).replace("___","<b>"+esc(it.w)+"</b>");
  const draw=()=>{
    if(stage==="check")return check();
    const full=`${it.w}. ${it.w} means ${it.m}.`;let body,btn,line;
    if(stage==="front"){body=`<div class="pic">${esc(it.e||"")}</div><div class="word">${esc(it.w)}</div><div class="ex">Tap the card to see what it means</div>`;btn="";line=it.w}
    else if(stage==="back"){body=`<div class="pic">${esc(it.e||"")}</div><div class="word">${esc(it.w)}</div><div class="mean">${esc(it.m)}</div><div class="ex">${ex(it.s)}</div>`;
      btn=`<button class="next" id="go">My turn to say it →</button>`;line=`${full} ${it.s.replace("___",it.w)}`}
    else{body=`<div class="turn">Your turn! Say it out loud:</div><div class="word">${esc(it.w)}</div><div class="mean">${esc(it.w)} means ${esc(it.m)}.</div>`;
      btn=`<button class="next go" id="go">I said it! ✓</button>`;line=`Now you say it. ${it.w} means ${it.m}.`}
    app.innerHTML=bar(i,W.length)+steps()+`<div class="card flash ${stage==="front"?"tap":""}" id="flash">${body}</div>
     <button class="say" id="say" style="align-self:center">🔊 Hear it again</button>${btn}`;
    wireBack("vocab");
    app.querySelector("#say").onclick=()=>hear(stage==="front"?it.w:full);
    if(stage==="front")app.querySelector("#flash").onclick=()=>{stage="back";draw()};
    const go=app.querySelector("#go");if(go)go.onclick=()=>{stage=stage==="back"?"turn":"check";draw()};
    say(line,200);
  };
  const check=()=>{
    const opts=shuffle([it,...others(it,2)]);
    app.innerHTML=bar(i,W.length)+steps()+`<div class="card"><div class="ask">Quick check</div>
     <div class="prompt">What does <span class="w">${esc(it.w)}</span> mean?</div><button class="say" id="say">🔊 Read it to me</button>
     <div class="choices long">${opts.map(o=>`<button class="choice" data-w="${esc(o.w)}">${esc(o.m)}</button>`).join("")}</div><div class="feedback" id="fb"></div></div>`;
    wireBack("vocab");
    const read=`What does ${it.w} mean? Is it: ${opts.map(o=>o.m).join("? Or, ")}?`;
    app.querySelector("#say").onclick=()=>hear(read);say(read,250);
    app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
      app.querySelectorAll(".choice").forEach(x=>x.disabled=true);const fb=app.querySelector("#fb");
      if(b.dataset.w===it.w){b.classList.add("right");beep(true);fb.className="feedback good";fb.textContent="You know it! Next card.";addCoins(1);
        speak(`Yes! ${it.w} means ${it.m}.`,()=>{if(i<W.length-1)cards(i+1);else cardsDone()},100)}
      else{b.classList.add("wrong");beep(false);addMiss(it.w);fb.className="feedback oops";fb.textContent="Not yet. Let's look at the card again.";
        speak("Not yet. Let's look at the card again.",()=>{stage="back";draw()},100)}
    });
  };
  draw();
}
function cardsDone(){
  const u=U(),first=!u.cards;u.cards=1;if(first){addXP(3);give("cards")}addCoins(first?15:3);savePlayer();
  app.innerHTML=`<div class="card result"><div class="bigicon pop">🎉</div><h2>All ${WORDS().length} cards done!</h2><p class="coinline">+${first?15:3} 🪙</p>

const ALT={def2word:"word2def",word2def:"def2word",sent:"sent2",sent2:"def2word",spell:"spell",same:"same",sspell:"sspell",blend:"sspell",mcq:"mcq",fact:"fact"};
function makeQ(item,kind,v){
  const W=item.w;
  if(kind==="def2word"){const o=shuffle([item,...others(item,3)]);
    return{ask:"Which word means…",html:`“${esc(item.m)}”`,read:`Which word means: ${item.m}?`,choices:o.map(x=>({label:x.w,ok:x===item,item:x})),right:`${W} means ${item.m}.`}}
  if(kind==="word2def"){const o=shuffle([item,...others(item,3)]);
    return{ask:"What does this word mean?",html:`<span class="w">${esc(W)}</span>`,read:`What does ${W} mean?`,long:true,choices:o.map(x=>({label:x.m,ok:x===item,item:x})),right:`${W} means ${item.m}.`}}
  if(kind==="sent"||kind==="sent2"){const s=(kind==="sent2"&&item.s2)?item.s2:item.s,o=shuffle([item,...others(item,3)]);
    return{ask:"Which word fits?",html:esc(s).replace("___",'<span class="blank" id="blank">&nbsp;</span>'),read:`Which word fits? ${s.replace("___","blank")}`,blank:true,
      choices:o.map(x=>({label:x.w,ok:x===item,item:x})),right:s.replace("___",W)}}
  if(kind==="same"){const isSame=v==="same",phrase=isSame?item.same:item.not;
    return{ask:"Same or not?",html:`Does <span class="w">${esc(W)}</span> mean the same as “${esc(phrase)}”?`,read:`Does ${W} mean the same as: ${phrase}?`,
      choices:[{label:"✓ Same",ok:isSame},{label:"✗ Not the same",ok:!isSame}],noList:true,
      right:isSame?`${W} and ${phrase} mean the same thing.`:`${W} means ${item.m}. That is not the same as ${phrase}.`,
      teach:isSame?`They mean the same! ${W} means ${item.m}, and “${phrase}” means that too.`:`Not the same. ${W} means ${item.m}. “${phrase}” is different.`}}
  if(kind==="blend"&&patternOf(W).type==="digraph"){const p=patternOf(W),pool=["ch","tch","sh","th","wh","ph"].filter(d=>d!==p.v&&!W.includes(d)),opts=shuffle([p.v,...shuffle(pool).slice(0,3)]);
    return{ask:"Sound spotter",html:`<span class="w">${esc(W)}</span><br>Which digraph do you hear? A digraph is two letters that make one sound.`,read:`${W}. Which digraph do you hear in ${W}? A digraph is two letters that make one sound.`,
      choices:opts.map(d=>({label:d,ok:d===p.v,spk:spellOut(d)})),right:`${W} has ${spellOut(p.v)}.`,teach:`${W} has ${p.v.toUpperCase()}. Those letters work together to make one sound.`,tspk:`${W} has ${spellOut(p.v)}. Those letters make one sound together.`}}
  if(kind==="blend"){const p=patternOf(W);
    if(p.type==="blend"){const pool=[...new Set([...SPL().map(x=>patternOf(x.w)).filter(x=>x&&x.type==="blend").map(x=>x.v),"scr","spr","str","spl","thr","squ"])].filter(b=>b!==p.v);
      const opts=shuffle([p.v,...shuffle(pool).slice(0,3)]);
      return{ask:"Blend spotter",html:`<span class="w">${esc(W)}</span><br>Which 3-letter blend does it start with?`,read:`${W}. Which blend does ${W} start with?`,
        choices:opts.map(b=>({label:b,ok:b===p.v,spk:spellOut(b)})),right:`${W} starts with ${spellOut(p.v)}.`,
        teach:`${W} starts with ${p.v.toUpperCase()}. Say it slowly: ${p.v}… ${W}.`,tspk:`${W} starts with ${spellOut(p.v)}. Say it slowly. ${W}.`}}
    const opts=shuffle([p.v,...shuffle([...new Set(W)].filter(c=>c!==p.v)).slice(0,3)]);
    return{ask:"Silent letter",html:`<span class="w">${esc(W)}</span><br>Which letter is silent? You see it, but you don't hear it.`,read:`${W}. Which letter in ${W} is silent?`,
      choices:opts.map(c=>({label:c,ok:c===p.v})),right:`In ${W}, the ${p.v} is silent.`,teach:`In ${W}, the ${p.v.toUpperCase()} is silent. We write it, but we don't say it.`}}
}

/* ---------- Game runner: a miss shows the answer, then the word comes back later as a different question ---------- */
function runGame(id){
  const W=WORDS();let queue;const final=id==="final"||id==="sp3"||id==="boss",daily=id==="daily";
  const anyKind=()=>shuffle(["def2word","word2def","sent","sent2","same"])[0],vv=()=>Math.random()<.5?"same":"not";
  if(daily){
    const tricky=Object.entries(U().miss).sort((a,b)=>b[1]-a[1]).map(x=>find(x[0])).filter(Boolean);
    const pickW=[...new Set([...tricky.slice(0,3),...shuffle(W)])].slice(0,CH?7:5);
    queue=pickW.map(w=>({w,kind:anyKind(),v:vv(),retry:0,src:"v"}));
    if(SPL().length){const ts=Object.entries(S().miss).sort((a,b)=>b[1]-a[1]).map(x=>findS(x[0])).filter(Boolean);
      [...new Set([...ts.slice(0,1),...shuffle(SPL())])].slice(0,2).forEach(w=>queue.push({w,kind:"sspell",retry:0,src:"s"}))}
    {const ml=mathLevels().find(l=>l.n&&!passed(l.id)&&isOpen(l.id))||mathLevels()[0];for(let j=0;j<(CH?3:2);j++){const k=1+(Math.random()*12|0),f=Math.random()<.5?{a:ml.n,b:k}:{a:k,b:ml.n};queue.push({w:{a:f.a,b:f.b,fam:ml.n,w:`${f.a}×${f.b}`},kind:"fact",retry:0,src:"x"})}}
    const SK=skLevels().filter(l=>l.items&&l.items.length);
    if(SK.length){const L=SK[Math.random()*SK.length|0],it=shuffle(L.items)[0];queue.push({w:Object.assign({},it,{area:L.name,w:it.c[it.a]}),kind:"mcq",retry:0,src:"k"})}
  }else if(/^k\d/.test(id)){const L=skLevels().find(l=>l.id===id);queue=shuffle(L.items).slice(0,8).map(it=>({w:Object.assign({},it,{area:L.name,w:it.c[it.a]}),kind:"mcq",retry:0,src:"k"}))}
  else if(/^y/.test(id)){const L=STRATS.find(l=>l.id===id);queue=Array.from({length:CH?10:8},()=>L.gen()).map(it=>({w:Object.assign(it,{area:L.name,w:it.c[it.a]}),kind:"mcq",retry:0,src:"y"}))}
  else if(id==="boss")queue=shuffle(W).flatMap(w=>[{w,kind:/\s/.test(w.w)?"def2word":"vtype",retry:0,src:"v"},{w,kind:Math.random()<.5?"word2def":"sent2",v:"same",retry:0,src:"v"}]).slice(0,14);
  else if(id==="sp1")queue=shuffle(SPL()).slice(0,10).map(w=>({w,kind:"sspell",retry:0,src:"s"}));
  else if(id==="sp2")queue=shuffle(SPL().filter(x=>patternOf(x.w))).slice(0,10).map(w=>({w,kind:"blend",retry:0,src:"s"}));
  else if(id==="sp3")queue=shuffle(SPL()).map(w=>({w,kind:"type",retry:0,src:"s"}));
  else{const kinds=id==="meaning"?()=>Math.random()<.5?"def2word":"word2def":id==="sentence"?()=>"sent":id==="spell"?()=>"spell":id==="same"?()=>"same":null;
    const mix=shuffle(["def2word","word2def","sent","sent2","spell","same","def2word","sent"]);
    queue=shuffle(W).map((w,k)=>({w,kind:kinds?kinds():mix[k%mix.length],v:vv(),retry:0,src:"v"}))}
  const n0=queue.length,tab=tabOf(id);let pos=0,score=0,earned=0;const firstMiss=new Set();
  const step=()=>{
    if(pos>=queue.length)return finish(id,score,n0,[...firstMiss],earned);
    const q=queue[pos];
    const done=right=>{
      if(right){const c=q.retry===0?2:1;earned+=c;addCoins(c)}
      if(q.retry===0){if(right)score++;else if(q.kind!=="mcq"&&q.kind!=="fact"){firstMiss.add(q.w.w);addMiss(q.w.w,q.src)}}
      if(!right&&!final&&q.retry<2)queue.push({w:q.w,kind:ALT[q.kind],v:q.v==="same"?"not":"same",retry:q.retry+1,src:q.src});
      pos++;step();
    };
    const base={i:pos,n:queue.length,done,final,retry:q.retry>0,tab};
    if(q.kind==="spell"){const it=q.w;spell(Object.assign(base,{target:it.w.toLowerCase(),ask:"Spell the word that means…",prompt:`“${esc(it.m)}”`,
      intro:final?`Spell the word that means: ${it.m}.`:`Spell the word that means: ${it.m}. The word is ${it.w}.`,again:`${it.w}. ${it.w} means ${it.m}.`,learn:`${it.w} means ${it.m}.`,hint:`It starts with ${it.w[0]}.`,sayBtn:!final}))}
    else if(q.kind==="sspell"){const it=q.w,p=patternOf(it.w),bl=blankOut(it.s,it.w);
      spell(Object.assign(base,{target:it.w,ask:"Listen and spell",prompt:bl?esc(bl).replace("___",'<span class="blank">&nbsp;</span>'):"Listen, then spell the word.",
      intro:`Spell ${it.w}. ${it.s||""} ${it.w}.`,again:`${it.w}. ${it.s||""} ${it.w}.`,learn:"",big:true,hint:p&&p.type==="blend"?`It starts with ${spellOut(p.v)}.`:p&&p.type==="digraph"?`Listen for ${spellOut(p.v)}.`:`It starts with ${it.w[0]}.`,sayBtn:true}))}
    else if(q.kind==="type")typeQ(q.w,base);
    else if(q.kind==="vtype")typeQ({w:q.w.w.toLowerCase(),s:(q.w.s2||q.w.s||"").replace("___",q.w.w)},base);
    else if(q.kind==="fact")factAsk(q.w.a,q.w.b,{head:bar(pos,queue.length),fam:q.w.fam,tab,label:"Math fact",done:(ok,first)=>done(ok&&first)});
    else if(q.kind==="mcq")ask(mcqQ(q.w),{w:q.w.c[q.w.a],m:""},pos,queue.length,done,{retry:q.retry>0,tab,retNote:"This question will come back later."});
    else ask(makeQ(q.w,q.kind,q.v),q.w,pos,queue.length,done,{final,retry:q.retry>0,tab});
  };
  step();
}

function ask(Q,item,i,n,done,o={}){
  const lbl=c=>c.spk||c.label;
  const list=Q.noList?"":Q.long?" Is it: "+Q.choices.map(lbl).join("? Or, ")+"?":" Is it "+Q.choices.map(lbl).join("; ").replace(/; ([^;]*)$/,", or $1")+"?";
  app.innerHTML=(o.head||bar(i,n))+`<div class="card">${o.retry?'<div class="again">↻ Word coming back</div>':""}<div class="ask">${Q.ask}</div><div class="prompt">${Q.html}</div>
   <button class="say" id="say">🔊 Read it to me</button>
   <div class="choices ${Q.long?"long":""}">${Q.choices.map((c,k)=>`<button class="choice" data-k="${k}">${esc(c.label)}</button>`).join("")}</div>
   <div class="feedback" id="fb"></div><div id="more" style="display:flex;flex-direction:column;gap:12px"></div></div>`;
  wireBack(o.tab);
  app.querySelector("#say").onclick=()=>hear(Q.read+list);
  if(!o.quiet)say((o.pre||"")+Q.read+list,250);else say(Q.read,150);
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    const c=Q.choices[+b.dataset.k],all=app.querySelectorAll(".choice"),fb=app.querySelector("#fb");all.forEach(x=>x.disabled=true);
    const bl=app.querySelector("#blank");
    if(c.ok){b.classList.add("right");beep(true);if(bl){bl.textContent=item.w;bl.classList.add("pop")}
      fb.className="feedback good";fb.textContent="Yes! You got it!";
      if(o.fast){setTimeout(()=>done(true),450);return}
      speak("Yes! "+Q.right,()=>done(true),150);return}
    b.classList.add("wrong");beep(false);
    all.forEach((x,k)=>{if(Q.choices[k].ok)x.classList.add("right");else if(x!==b)x.classList.add("dim")});
    if(bl&&!o.final)bl.textContent=item.w;
    if(o.fast){fb.className="feedback oops";fb.textContent=`It was ${item.w}`;setTimeout(()=>done(false),900);return}
    fb.className="feedback oops";fb.textContent=o.final?"Not this time.":"Not quite.";
    if(o.final){speak("Not this time. Let's keep going.",()=>done(false),150);return}
    const picked=c.item&&c.item!==item?c.item:null;
    const teachHtml=Q.teach?esc(Q.teach):`The answer is <b>${esc(item.w)}</b>. It means ${esc(item.m)}.${picked?`<br>You picked <b>${esc(picked.w)}</b>, which means ${esc(picked.m)}.`:""}`;
    app.querySelector("#more").innerHTML=`<div class="teach">${teachHtml}</div>${o.noReturn?"":`<p class="note">${o.retNote||"This word will come back later with a new question."}</p>`}<button class="next" id="nx">Got it, next →</button>`;
    say(`Not quite. ${Q.tspk||Q.teach||`The answer is ${item.w}. ${item.w} means ${item.m}.`}`,150);
    app.querySelector("#nx").onclick=()=>done(false);
  });
}

function spell(o){
  if(CH)o.hint="";
  const full=o.target,target=full.replace(/ /g,""),letters=shuffle([...target].map((c,k)=>({c,k})).concat(CH&&!o.final?shuffle("abcdefghiklmnoprstuwy".split("").filter(c=>!target.includes(c))).slice(0,3).map((c,j)=>({c,k:100+j})):[]));
  let placed=[],tries=0,locked=0;
  const draw=mark=>{
    app.innerHTML=bar(o.i,o.n)+`<div class="card">${o.retry?'<div class="again">↻ Word coming back</div>':""}<div class="ask">${o.ask}</div>
     <div class="prompt">${o.prompt}</div>
     ${o.sayBtn?(o.big?`<button class="bigsay" id="say">🔊 Hear the word</button>`:`<button class="say" id="say">🔊 Say the word</button>`):""}
     <div class="slots ${mark||""}" id="slots">${(()=>{let k=-1;return[...full].map(ch=>{if(ch===" ")return'<span style="width:14px"></span>';k++;const p=placed[k];
       return `<button class="slot ${p?"on":""} ${k<locked?"keep":""} ${mark==="bad"&&p&&p.c!==target[k]?"miss":""}" data-k="${k}">${p?esc(p.c):""}</button>`}).join("")})()}</div>
     <div class="tiles">${letters.map(l=>`<button class="tile ${placed.includes(l)?"used":""}" data-k="${l.k}">${esc(l.c)}</button>`).join("")}</div>
     <div class="feedback" id="fb"></div><div id="more" style="display:flex;flex-direction:column;gap:12px"></div></div>`;
    wireBack(o.tab);
    const s=app.querySelector("#say");if(s)s.onclick=()=>hear(o.again);
    if(mark)return;
    app.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{const l=letters.find(l=>l.k==t.dataset.k);placed.push(l);if(placed.length<target.length)say(l.c);check()});
    app.querySelectorAll(".slot.on").forEach(sl=>sl.onclick=()=>{const k=+sl.dataset.k;if(k<locked)return;placed=placed.slice(0,k);draw()});
  };
  const keepRight=()=>{let k=0;while(k<placed.length&&placed[k].c===target[k])k++;placed=placed.slice(0,k);
    if(tries>=2&&!o.final&&k<target.length){const l=letters.find(l=>l.c===target[k]&&!placed.includes(l));if(l){placed.push(l);k++}}locked=k};
  const check=()=>{
    draw();if(placed.length<target.length)return;
    if(placed.map(p=>p.c).join("")===target){draw("ok");beep(true);const f=app.querySelector("#fb");f.className="feedback good";f.textContent="Perfect spelling!";
      speak("Perfect! "+spellOut(target)+". "+full+"!",()=>o.done(tries===0),150);return}
    tries++;draw("bad");beep(false);const f=app.querySelector("#fb");f.className="feedback oops";
    if(o.final){f.textContent="Not this time.";speak("Not this time. Let's keep going.",()=>o.done(false),150);return}
    if(tries>=3){f.textContent="Let's learn this one.";
      app.querySelector("#more").innerHTML=`<div class="teach">It's spelled <b>${esc(full.toUpperCase().split("").join(" "))}</b>. ${esc(o.learn)}</div><button class="next" id="nx">Got it, next →</button>`;
      say(`It's spelled ${spellOut(target)}. ${target}. This word will come back later.`,150);app.querySelector("#nx").onclick=()=>o.done(false);return}
    f.textContent=tries>=2?"I kept your right letters and added one.":"Almost! I kept the letters you got right. "+o.hint;
    say(tries>=2?"Almost! I kept your right letters and added one more.":"Almost! I kept the letters you got right. "+o.hint,150);
    setTimeout(()=>{keepRight();draw();const g=app.querySelector("#fb");g.className="feedback oops";g.textContent=tries>=2?"Keep going!":o.hint},1100);
  };
  draw();say(o.intro,250);
}

/* ---------- Spelling test: type each word, like Friday ---------- */
function typeQ(item,o){
  const w=item.w;let typed="",locked=false;const bl=blankOut(item.s,w);
  const line=`${w}. ${item.s||""} ${w}.`;
  const draw=()=>{
    app.innerHTML=bar(o.i,o.n)+`<div class="card"><div class="ask">Spelling test · word ${o.i+1} of ${o.n}</div>
     <button class="bigsay" id="say">🔊 Hear the word</button>
     ${bl?`<p class="prompt" style="font-size:20px">${esc(bl).replace("___",'<span class="blank">&nbsp;</span>')}</p>`:""}
     <div class="typed" id="typed">${esc(typed)}<span class="caret"></span></div>
     <div class="kb">${["qwertyuiop","asdfghjkl","zxcvbnm"].map((r,ri)=>`<div class="kbrow">${[...r].map(c=>`<button class="key" data-c="${c}">${c}</button>`).join("")}${ri===2?`<button class="key wide" data-c="del" aria-label="Delete">⌫</button>`:""}</div>`).join("")}</div>
     <button class="btn big" id="chk" ${typed?"":"disabled"}>✓ Check</button>
     <div class="feedback" id="fb"></div><div id="more" style="display:flex;flex-direction:column;gap:12px"></div></div>`;
    wireBack(o.tab);
    app.querySelector("#say").onclick=()=>hear(line);
    app.querySelectorAll(".key").forEach(k=>k.onclick=()=>press(k.dataset.c));
    app.querySelector("#chk").onclick=check;
  };
  const refresh=()=>{const t=app.querySelector("#typed");if(t)t.innerHTML=esc(typed)+'<span class="caret"></span>';const c=app.querySelector("#chk");if(c)c.disabled=!typed};
  const press=c=>{if(locked)return;if(c==="del")typed=typed.slice(0,-1);else if(typed.length<16){typed+=c;tones([[600,0,.05]],"square",.03)}refresh()};
  const check=()=>{
    if(locked||!typed)return;locked=true;document.onkeydown=null;
    app.querySelectorAll(".key,#chk").forEach(k=>k.disabled=true);
    const t=app.querySelector("#typed"),fb=app.querySelector("#fb");
    if(typed===w){t.classList.add("ok");t.textContent=typed;beep(true);fb.className="feedback good";fb.textContent="Correct!";speak("Correct! "+w+".",()=>o.done(true),100);return}
    t.classList.add("bad");beep(false);fb.className="feedback oops";fb.textContent="Not quite.";
    app.querySelector("#more").innerHTML=`<div class="teach">You wrote <b>${esc(typed)}</b>. It's spelled <b>${esc(w.toUpperCase().split("").join(" "))}</b>.</div><button class="next" id="nx">Next word →</button>`;
    say(`Not quite. ${w} is spelled ${spellOut(w)}.`,150);app.querySelector("#nx").onclick=()=>o.done(false);
  };
  document.onkeydown=e=>{if(screen!=="play")return;const k=e.key.toLowerCase();
    if(/^[a-z]$/.test(k)){press(k);e.preventDefault()}else if(k==="backspace"){press("del");e.preventDefault()}else if(k==="enter"){check();e.preventDefault()}};
  draw();say(`Word ${o.i+1}. ${line}`,250);
}

function finish(id,score,n,missed,earned){
  hush();document.onkeydown=null;
  const isSp=id.startsWith("sp"),isK=/^k/.test(id),rec=recFor(id),stars=starsCalc(score,n),tab=tabOf(id);
  if(id==="daily"){
    const firstToday=P().dailyLast!==today();P().dailyLast=today();updateStreak();if(firstToday){addXP(3);addCoins(10)}savePlayer();
    app.innerHTML=`<div class="card result"><div class="bigicon pop">🔥</div><h2>${firstToday?"Daily Practice done!":"Nice extra practice!"}</h2>
     <p>${score} of ${n} right on the first try</p><p class="coinline">+${earned+(firstToday?10:0)} 🪙</p><p class="unlock">${P().streak.n} day streak</p>
     ${missed.length?`<div class="box coral" style="width:100%;text-align:left"><h3>Keep practicing</h3><div class="chips">${missed.map(w=>`<span class="chip">${esc(w)}</span>`).join("")}</div></div>`:""}

  }
  const was=rec.best[id]||0,bonus=3+(stars>was?(stars-was)*10:0);
  if(stars>was){rec.best[id]=stars;addXP(stars-was)}
  addCoins(bonus);savePlayer();
  if(stars>=PASS)give(id);
  const list=isSp?spLevels():isK?skLevels():LEVELS,idx=list.findIndex(l=>l.id===id),nextL=idx>=0?list[idx+1]:null;
  const opened=nextL&&stars>=PASS&&was<PASS?nextL:null,beat=idx===list.length-1&&stars>=PASS&&was<PASS;

  beep(stars>=PASS);

   <h2>${msg}</h2><p>${score} of ${n} right on the first try</p><p class="coinline">+${earned+bonus} 🪙</p>
   ${opened?`<p class="unlock">${opened.name} is open!</p>`:""}${beat?`<p class="unlock">You beat the obby!</p>`:""}
   ${stars<PASS&&nextL?`<p>Get 2 stars to open the next level.</p>`:""}
   ${missed.length?`<div class="box coral" style="width:100%;text-align:left"><h3>Words to practice</h3><div class="chips">${missed.map(w=>`<span class="chip">${esc(w)}</span>`).join("")}</div></div>`:""}
   <div class="row" style="width:100%"><button class="ghost" id="again">Play again</button>
   <button class="btn" id="h">${opened||beat?"🦘 Jump!":"Back to map"}</button></div></div>`;
  say(`${msg} You got ${score} out of ${n} on the first try.${opened?` ${opened.name} is open! Tap jump!`:""}${beat?" You beat the obby!":""}${stars<PASS&&nextL?" Try again to get two stars.":""}`,500);
  app.querySelector("#again").onclick=()=>start(id);
  app.querySelector("#h").onclick=()=>home(tab);
}

    const rb=app.querySelector("#rb");

      rb.querySelector("#go").onclick=()=>listen(0);rb.querySelector("#skip").onclick=()=>{hush();stage="ready";draw()}}
    if(stage==="ready"){rb.innerHTML=`<button class="ghost" id="again">🔊 Listen again</button><button class="btn" id="go">▶ Start</button>`;
      rb.querySelector("#again").onclick=()=>{stage="listen";draw();listen(0)};rb.querySelector("#go").onclick=()=>{hush();t0=Date.now();stage="reading";draw();
        tick=setInterval(()=>{const t=app.querySelector("#tm");if(!t)return;const s=Math.floor((Date.now()-t0)/1000);t.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`},250)}}
    if(stage==="reading"){rb.innerHTML=`<button class="btn red big" id="stop">■ Stop</button>`;

  };
  function listen(i){if(i===0){stage="listen";hl(-1)}if(i>=phrases.length){hl(-1);stage="ready";draw();say("Your turn! Grown-up, tap start.");return}

function confetti(n=60){const C=["#ff4b4b","#3b82f6","#ffcf1f","#22c55e","#8b5cf6","#ff9f1c","#ff6fb5"];
  for(let i=0;i<n;i++){const d=document.createElement("div");d.className="confetti";d.style.left=Math.random()*100+"vw";d.style.background=C[i%C.length];d.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}}
function gHead(cfg,stats){return `<div class="bar"><button class="back" id="back">← Games</button><span style="flex:1;font-family:var(--display);font-size:20px">${esc(cfg.title)}</span>${stats}</div>`}
function gQuit(cfg,clean){return()=>{clean&&clean();hush();document.onkeydown=null;home(cfg.tab)}}
function gameEnd(cfg,score,max,line){
  hush();document.onkeydown=null;screen="play";const p=P();p.games=p.games||{};const prev=p.games[cfg.id]||0,rec=score>prev;if(rec)p.games[cfg.id]=score;
  const coins=Math.min(25,Math.max(2,score))+(rec&&prev?5:0);addCoins(coins);if(score>=Math.ceil(max*.6))addXP(1);savePlayer();
  if(score>=Math.ceil(max*.6))confetti();
  app.innerHTML=`<div class="card result"><div class="bigicon pop">${cfg.icon||"🎮"}</div><h2>${rec&&prev?"New high score!":score>=Math.ceil(max*.6)?"Awesome!":"Nice try!"}</h2>
   <p class="timer">${score}</p><p>${esc(line||"points")}${prev?` · best ${Math.max(prev,score)}`:""}</p><p class="coinline">+${coins} 🪙</p>
   <div class="row" style="width:100%"><button class="ghost" id="again">Play again</button><button class="btn" id="h">Back</button></div></div>`;
  beep(true);say(`${rec&&prev?"New high score! ":""}You got ${score}! Great playing!`,250);
  app.querySelector("#again").onclick=()=>cfg.restart();app.querySelector("#h").onclick=()=>home(cfg.tab);
}

/* ---------- Bubble Pop: pop the bubble that answers the prompt ---------- */
function bubbleGame(cfg){
  screen="play";hush();
  let score=0,left=cfg.seconds||60,ri=0,over=false,spawn=null,tick=null,rounds=shuffle(cfg.rounds);
  const speed=cfg.speed||7;
  app.innerHTML=gHead(cfg,`<span class="hbtn">⏱ <b id="tl">${left}</b></span><span class="hbtn">⭐ <b id="sc">0</b></span>`)+
   `<div class="card" style="padding:12px 14px;gap:8px"><div class="gprompt ${cfg.small?"small":""}" id="gp"></div><button class="say" id="say" style="align-self:center">🔊 Hear it</button></div>
   <div class="gfield" id="gf"><div class="gground"></div></div>`;
  const gf=app.querySelector("#gf"),clean=()=>{over=true;clearInterval(spawn);clearInterval(tick)};
  app.querySelector("#back").onclick=gQuit(cfg,clean);
  const R=()=>rounds[ri%rounds.length];
  const show=()=>{if(over)return;const r=R();app.querySelector("#gp").innerHTML=r.html||esc(r.prompt);say(r.read||r.prompt,100);gf.querySelectorAll(".bub").forEach(b=>b.remove());lane=0;spawnOne();spawnOne()};
  app.querySelector("#say").onclick=()=>hear(R().read||R().prompt);
  let lane=0;
  const spawnOne=()=>{if(over)return;const r=R(),opts=shuffle(r.options);const want=Math.random()<.4||!gf.querySelector(`.bub[data-ok="1"]`);
    const label=want?r.target:opts.find(o=>o!==r.target)||r.target;
    const b=document.createElement("button");b.className="bub";b.textContent=label;b.dataset.ok=label===r.target?"1":"0";
    const lanes=[4,36,68];b.style.left=`calc(${lanes[lane++%3]}% + ${Math.random()*4|0}%)`;b.style.animationDuration=(speed+Math.random()*2)+"s";
    if(label.length>7)b.style.fontSize="18px";
    b.onclick=()=>{if(over)return;if(b.dataset.ok==="1"){b.classList.add("pop");score++;app.querySelector("#sc").textContent=score;tones([[880,0,.07],[1320,.06,.1]],"triangle",.08);setTimeout(()=>{ri++;show()},350)}
      else{b.classList.add("no");beep(false);if(cfg.onWrong)cfg.onWrong(R());setTimeout(()=>b.remove(),500)}};
    b.addEventListener("animationend",e=>{if(e.animationName==="bubUp")b.remove()});gf.appendChild(b)};
  spawn=setInterval(()=>{if(!gf.isConnected)return clean();spawnOne()},Math.max(700,speed*170));
  tick=setInterval(()=>{if(over)return;if(!gf.isConnected)return clean();left--;const t=app.querySelector("#tl");if(t)t.textContent=left;if(left<=0){clean();gameEnd(cfg,score,cfg.goal||12,cfg.unit||"popped")}},1000);
  show();
}

/* ---------- Letter Rain: tap the letters of the word as they fall ---------- */
function letterRain(cfg){
  screen="play";hush();
  let score=0,left=cfg.seconds||90,wi=0,k=0,over=false,tick=null;const words=shuffle(cfg.words);
  const fall=cfg.fall||7;
  app.innerHTML=gHead(cfg,`<span class="hbtn">⏱ <b id="tl">${left}</b></span><span class="hbtn">⭐ <b id="sc">0</b></span>`)+
   `<div class="card" style="padding:12px 14px;gap:8px"><div class="slots" id="sl"></div><button class="say" id="say" style="align-self:center">🔊 Hear the word</button></div>
   <div class="gfield" id="gf"><div class="gground"></div></div>`;
  const gf=app.querySelector("#gf"),clean=()=>{over=true;clearInterval(tick)};
  app.querySelector("#back").onclick=gQuit(cfg,clean);
  const W=()=>words[wi%words.length];
  app.querySelector("#say").onclick=()=>hear(W().w+". "+(W().s||""));
  const slots=()=>{if(over)return;const w=W().w;app.querySelector("#sl").innerHTML=[...w].map((c,i)=>`<span class="slot ${i<k?"on keep":""}">${i<k?esc(c):""}</span>`).join("")};
  const drop=()=>{gf.querySelectorAll(".drop").forEach(d=>d.remove());const w=W().w;
    const uq=[...new Set(w)],pool=shuffle(uq.concat(shuffle("abcdefghijklmnoprstuvwy".split("").filter(c=>!w.includes(c))).slice(0,Math.max(1,Math.min(cfg.decoys||3,9-uq.length)))));
    pool.forEach((c,i)=>{const d=document.createElement("button");d.className="drop";d.textContent=c;d.dataset.c=c;
      d.style.left=`calc(${(i%5)*19+2}% )`;d.style.animationDuration=(fall+Math.random()*2.5)+"s";d.style.animationDelay=(-Math.random()*fall)+"s";
      d.onclick=()=>{if(over)return;if(c===w[k]){k++;tones([[700+k*60,0,.06]],"square",.04);slots();
          if(k>=w.length){score++;app.querySelector("#sc").textContent=score;beep(true);gf.querySelectorAll(".drop").forEach(x=>x.classList.add("got"));say(w+"!",50);setTimeout(()=>{wi++;k=0;next()},700)}}
        else{d.classList.add("no");beep(false);setTimeout(()=>d.classList.remove("no"),400)}};
      gf.appendChild(d)})};
  const next=()=>{if(over)return;slots();drop();say(`Spell ${W().w}. ${W().s||""}`,150)};
  tick=setInterval(()=>{if(over)return;if(!gf.isConnected)return clean();left--;const t=app.querySelector("#tl");if(t)t.textContent=left;if(left<=0){clean();gameEnd(cfg,score,cfg.goal||6,"words spelled")}},1000);
  next();
}

/* ---------- Memory Match: flip two cards, find the pairs ---------- */
function memoryGame(cfg){
  screen="play";hush();
  const deck=shuffle(cfg.pairs.flatMap((p,i)=>[{t:p.a,k:i,emo:p.aEmo},{t:p.b,k:i,emo:p.bEmo}]));
  let up=[],moves=0,found=0,lock=false,gone=false;
  const draw=()=>{if(gone)return;app.innerHTML=gHead(cfg,`<span class="hbtn">👆 <b>${moves}</b></span><span class="hbtn">✅ <b>${found}/${cfg.pairs.length}</b></span>`)+
    `<div class="card" style="padding:12px 14px"><p class="note" style="text-align:center">${esc(cfg.help||"Find the matching pairs!")}</p><div class="mgrid">${deck.map((c,i)=>`<button class="mcard ${c.done?"done":up.includes(i)?"up":""} ${c.emo?"emo":""}" data-i="${i}" aria-label="${c.done||up.includes(i)?esc(c.t):"card"}">${c.done||up.includes(i)?esc(c.t):"?"}</button>`).join("")}</div></div>`;
    app.querySelector("#back").onclick=gQuit(cfg,()=>{gone=true});
    app.querySelectorAll(".mcard").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,c=deck[i];if(lock||c.done||up.includes(i))return;up.push(i);if(!c.emo)say(c.t,0);tones([[520,0,.05]],"square",.04);
      if(up.length===2){moves++;const [x,y]=up.map(j=>deck[j]);
        if(x.k===y.k){x.done=y.done=true;found++;up=[];draw();beep(true);if(found===cfg.pairs.length){setTimeout(()=>{if(gone)return;const best=cfg.pairs.length,sc=Math.max(1,best*3-Math.max(0,moves-best));gameEnd(cfg,sc,best*2,"points")},700)}return}
        lock=true;draw();setTimeout(()=>{up=[];lock=false;if(app.querySelector(".mgrid"))draw()},1100);return}
      draw()})};
  draw();say(cfg.help||"Find the matching pairs!",150);
}

/* ---------- Jump Run: answer to jump to the right block ---------- */
function runnerGame(cfg){
  screen="play";hush();
  const items=shuffle(cfg.items).slice(0,cfg.n||10);let i=0,score=0,hearts=cfg.hearts||3,over=false,tmr=null,t0=0;
  const COL=["var(--blue)","var(--orange)","var(--purple)"];
  const clean=()=>{over=true;clearInterval(tmr)};
  const draw=()=>{const it=items[i];
    app.innerHTML=gHead(cfg,`<span class="hearts" aria-label="${hearts} hearts">${"❤️".repeat(hearts)}${"🤍".repeat(Math.max(0,(cfg.hearts||3)-hearts))}</span><span class="hbtn">⭐ <b>${score}</b></span>`)+
     `<div class="card" style="padding:12px 14px;gap:8px"><div class="gprompt ${it.small?"small":""}">${it.html||esc(it.q)}</div>${cfg.time?`<div class="gtime"><div id="gt" style="width:100%"></div></div>`:""}<button class="say" id="say" style="align-self:center">🔊 Hear it</button></div>
     <div class="rscene" id="rs"><div class="rbase"></div><div class="rav" id="rav">${avatarSVG(P().avatar,80)}</div>
     ${it.choices.map((c,k)=>`<button class="rblock" data-k="${k}" style="top:${18+k*92}px;background:${COL[k%3]}">${esc(c)}</button>`).join("")}</div>
     <p class="note" style="text-align:center">Question ${i+1} of ${items.length}. Tap the right block to jump!</p>`;
    app.querySelector("#back").onclick=gQuit(cfg,clean);app.querySelector("#say").onclick=()=>hear(it.read||it.q);
    say(it.read||it.q,120);
    app.querySelectorAll(".rblock").forEach(b=>b.onclick=()=>pick(+b.dataset.k,b));
    if(cfg.time){t0=Date.now();clearInterval(tmr);tmr=setInterval(()=>{if(over)return;if(!app.querySelector("#rs"))return clean();const f=1-(Date.now()-t0)/(cfg.time*1000),g=app.querySelector("#gt");if(g)g.style.width=Math.max(0,f*100)+"%";if(f<=0){clearInterval(tmr);pick(-1,null)}},150)}
  };
  let busy=false;
  const pick=(k,b)=>{if(over||busy||!app.querySelector("#rs"))return;busy=true;clearInterval(tmr);const it=items[i],av=app.querySelector("#rav");
    if(k===it.ans){score++;sfx.jump();av.style.left="62%";av.style.bottom=(300-18-k*92-4)+"px";av.style.transform="translateY(0)";
      setTimeout(()=>{busy=false;if(over)return;i++;if(i>=items.length){clean();gameEnd(cfg,score,items.length,"jumps")}else draw()},800);return}
    hearts--;if(b)b.classList.add("no");beep(false);av.classList.add("fall");
    const ok=app.querySelectorAll(".rblock")[it.ans];if(ok){ok.style.outline="5px solid var(--green)"}
    say(`Oops! It was ${it.choices[it.ans]}.`,100);
    setTimeout(()=>{busy=false;if(over)return;i++;if(hearts<=0||i>=items.length){clean();gameEnd(cfg,score,items.length,"jumps")}else draw()},1500)};
  draw();
}
